<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pixel Blocks — Платформер</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a1a;
      font-family: 'Segoe UI', 'Arial', sans-serif;
      touch-action: manipulation;
      position: fixed;
    }

    .rotate-screen {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      height: 100dvh;
      background: #0a0a1a;
      z-index: 1000;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }
    .rotate-screen .phone-icon {
      font-size: 80px;
      animation: rotate-phone 2s ease-in-out infinite;
    }
    @keyframes rotate-phone {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
    }
    .rotate-screen h2 {
      color: #FFD700;
      font-size: 24px;
      text-align: center;
      font-weight: 600;
    }
    .rotate-screen p {
      color: #aaa;
      font-size: 16px;
      text-align: center;
    }

    .game-wrapper {
      display: none;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      position: fixed;
      top: 0; left: 0;
      background: #5c94fc;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #5c94fc;
    }

    .hud {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      background: rgba(10,10,26,0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 10px 24px;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.25);
      z-index: 10;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      pointer-events: none;
    }
    .hud span {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .game-controls {
      position: absolute;
      bottom: 20px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 20;
      pointer-events: none;
    }
    .dpad {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      pointer-events: auto;
    }
    .dpad-row {
      display: flex;
      gap: 5px;
    }
    .action-row {
      display: flex;
      gap: 10px;
      align-items: center;
      pointer-events: auto;
    }

    .ctrl-btn {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      border: 2px solid rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.1s;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .ctrl-btn:active, .ctrl-btn.pressed {
      background: rgba(255,215,0,0.85);
      color: #000;
      border-color: #fff;
      transform: scale(0.9);
    }

    .jump-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      font-size: 17px;
      font-weight: 800;
      background: rgba(220,50,50,0.6);
      border-color: rgba(255,100,100,0.7);
      letter-spacing: 1px;
    }

    .small-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      font-size: 17px;
      background: rgba(100,100,255,0.4);
    }

    .game-controls.hidden {
      display: none;
    }
  </style>
</head>
<body>

<div class="rotate-screen" id="rotateScreen">
  <div class="phone-icon">📱</div>
  <h2>Поверните телефон</h2>
  <p>Для игры нужна альбомная ориентация</p>
</div>

<div class="game-wrapper" id="gameWrapper">
  <canvas id="gameCanvas"></canvas>

  <div class="hud">
    <span>🪙 <span id="coinCounter">0</span></span>
    <span>❤️ <span id="livesCounter">3</span></span>
    <span>⭐ <span id="scoreCounter">0</span></span>
    <span>🗺️ <span id="mapCounter">1</span></span>
  </div>

  <div class="game-controls" id="gameControls">
    <div class="dpad">
      <div class="ctrl-btn" id="btnUp">▲</div>
      <div class="dpad-row">
        <div class="ctrl-btn" id="btnLeft">◀</div>
        <div class="ctrl-btn" id="btnRight">▶</div>
      </div>
    </div>
    <div class="action-row">
      <div class="ctrl-btn small-btn" id="btnMenu">🏠</div>
      <div class="ctrl-btn small-btn" id="btnRestart">↺</div>
      <div class="ctrl-btn jump-btn" id="btnJump">ПРЫГ</div>
    </div>
  </div>
</div>

<script>
  (function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const coinSpan = document.getElementById('coinCounter');
    const livesSpan = document.getElementById('livesCounter');
    const scoreSpan = document.getElementById('scoreCounter');
    const mapSpan = document.getElementById('mapCounter');
    const gameControls = document.getElementById('gameControls');
    const gameWrapper = document.getElementById('gameWrapper');

    const WORLD_W = 1280;
    const WORLD_H = 720;
    const GROUND_Y = WORLD_H - 70;

    // ---------- СОСТОЯНИЕ ----------
    let totalCoins = 0;
    let currentMap = 1;
    let unlockedMaps = 1;
    let gameState = 'menu';

    const player = {
      x: 100, y: GROUND_Y - 54, w: 40, h: 54,
      vx: 0, vy: 0, speed: 7, jumpPower: -13.5, gravity: 0.78,
      onGround: false, facing: 1, invincible: 0
    };

    let worldWidth = 4000;
    let cameraX = 0;
    let mapTheme = null;
    let platforms = [];
    let coinsList = [];
    let enemies = [];
    let boss = null;
    let flag = null;
    let decorations = [];
    let animationFrame = 0;

    let mapCoins = 0;
    let mapLives = 3;
    let mapScore = 0;

    // ---------- ТЕМЫ КАРТ ----------
    const themes = {
      1: {
        name: 'Лесная тропа',
        skyTop: '#4a90d9', skyBottom: '#b8e6ff',
        groundColor: '#5a8f3d', groundTop: '#4CAF50',
        platformColor: '#8B5E3C',
        enemyColor: '#8B4513',
        boss: false,
        decorations: 'forest',
        worldLength: 3500,
        numPlatforms: 14, numCoins: 20, numEnemies: 6,
        enemySpeed: 1.8
      },
      2: {
        name: 'Подземелье',
        skyTop: '#1a1a2e', skyBottom: '#2d2d44',
        groundColor: '#4a4a4a', groundTop: '#666',
        platformColor: '#5c4a3a',
        enemyColor: '#6B3A2A',
        boss: true, bossHP: 3,
        decorations: 'cave',
        worldLength: 4200,
        numPlatforms: 16, numCoins: 24, numEnemies: 8,
        enemySpeed: 2.2
      },
      3: {
        name: 'Огненный замок',
        skyTop: '#2d0000', skyBottom: '#4a0000',
        groundColor: '#3d1a1a', groundTop: '#8B0000',
        platformColor: '#5c3030',
        enemyColor: '#8B0000',
        boss: true, bossHP: 4,
        decorations: 'fire',
        worldLength: 5000,
        numPlatforms: 18, numCoins: 28, numEnemies: 10,
        enemySpeed: 2.6
      },
      4: {
        name: 'Ледяные пики',
        skyTop: '#1a3a5c', skyBottom: '#a8d8ea',
        groundColor: '#b8d8f0', groundTop: '#e8f4f8',
        platformColor: '#c8e8f8',
        enemyColor: '#4a7a9a',
        boss: true, bossHP: 5,
        decorations: 'ice',
        worldLength: 5800,
        numPlatforms: 20, numCoins: 32, numEnemies: 12,
        enemySpeed: 3.0
      },
      5: {
        name: 'Финальная битва',
        skyTop: '#0a001a', skyBottom: '#2a004a',
        groundColor: '#1a1a3a', groundTop: '#4a4a8a',
        platformColor: '#3a3a5a',
        enemyColor: '#4a006a',
        boss: true, bossHP: 6,
        decorations: 'final',
        worldLength: 6600,
        numPlatforms: 22, numCoins: 36, numEnemies: 14,
        enemySpeed: 3.5
      }
    };

    // ---------- ГЕНЕРАЦИЯ КАРТЫ ----------
    function generateMap(mapNumber) {
      platforms = [];
      coinsList = [];
      enemies = [];
      boss = null;
      flag = null;
      decorations = [];

      const t = themes[mapNumber];
      mapTheme = t;
      worldWidth = t.worldLength;

      for (let i = 0; i < worldWidth; i += 400) {
        platforms.push({ x: i, y: GROUND_Y, w: Math.min(400, worldWidth - i), h: 70, color: t.groundColor });
      }

      if (t.decorations === 'forest') {
        for (let i = 0; i < worldWidth; i += 200 + Math.random() * 300) {
          decorations.push({ type: 'tree', x: i, y: GROUND_Y, h: 120 + Math.random() * 80 });
        }
      } else if (t.decorations === 'cave') {
        for (let i = 0; i < worldWidth; i += 180 + Math.random() * 250) {
          decorations.push({ type: 'stalactite', x: i, y: 0, h: 60 + Math.random() * 100 });
        }
        for (let i = 0; i < worldWidth; i += 400) {
          decorations.push({ type: 'torch', x: i + 200, y: GROUND_Y - 180 });
        }
      } else if (t.decorations === 'fire') {
        for (let i = 0; i < worldWidth; i += 150 + Math.random() * 200) {
          decorations.push({ type: 'fire', x: i, y: GROUND_Y - 20 });
        }
        for (let i = 0; i < worldWidth; i += 500) {
          decorations.push({ type: 'lava_pool', x: i + 100, y: GROUND_Y - 5 });
        }
      } else if (t.decorations === 'ice') {
        for (let i = 0; i < worldWidth; i += 200 + Math.random() * 250) {
          decorations.push({ type: 'ice_crystal', x: i, y: GROUND_Y - 100 - Math.random() * 200 });
        }
      } else if (t.decorations === 'final') {
        for (let i = 0; i < worldWidth; i += 300 + Math.random() * 200) {
          decorations.push({ type: 'dark_pillar', x: i, y: GROUND_Y - 150, h: 100 + Math.random() * 80 });
        }
        for (let i = 0; i < worldWidth; i += 500) {
          decorations.push({ type: 'void_rift', x: i + 200, y: GROUND_Y - 30 });
        }
      }

      for (let i = 0; i < t.numPlatforms; i++) {
        let px = 120 + (i / t.numPlatforms) * (worldWidth - 500);
        let py = GROUND_Y - 80 - Math.random() * 320;
        let pw = 100 + Math.random() * 150;
        if (px + pw > worldWidth - 50) px = worldWidth - pw - 50;
        platforms.push({ x: px, y: py, w: pw, h: 24, color: t.platformColor });
      }

      for (let i = 0; i < t.numCoins; i++) {
        let cx = 100 + (i / t.numCoins) * (worldWidth - 250);
        let cy = GROUND_Y - 50 - Math.random() * 350;
        coinsList.push({ x: cx, y: cy, r: 14, collected: false });
      }

      for (let i = 0; i < t.numEnemies; i++) {
        let ex = 500 + (i / Math.max(1, t.numEnemies - 1)) * (worldWidth - 900);
        if (t.numEnemies === 1) ex = worldWidth / 2;
        let speed = t.enemySpeed + Math.random() * 2.5;
        if (Math.random() < 0.5) speed *= -1;
        enemies.push({ x: ex, y: GROUND_Y - 40, w: 38, h: 40, vx: speed, color: t.enemyColor, alive: true });
      }

      const finishX = worldWidth - 300;
      if (t.boss) {
        platforms.push({ x: finishX - 60, y: GROUND_Y - 80, w: 240, h: 24, color: '#555' });
        boss = {
          x: finishX - 20, y: GROUND_Y - 150, w: 64, h: 74,
          vx: 3 + mapNumber * 0.9, hp: t.bossHP, maxHp: t.bossHP,
          color: t.enemyColor, alive: true, invulnerable: 0
        };
      } else {
        platforms.push({ x: finishX - 50, y: GROUND_Y - 110, w: 140, h: 24, color: '#DAA520' });
        flag = { x: finishX + 30, y: GROUND_Y - 100, w: 18, h: 100, flagColor: '#00FF00' };
      }
    }

    // ---------- СБРОС / РЕСТАРТ ----------
    function fullReset() {
      player.x = 100;
      player.y = GROUND_Y - 54;
      player.vx = 0; player.vy = 0;
      player.onGround = false;
      player.facing = 1;
      player.invincible = 0;
      cameraX = 0;
      generateMap(currentMap);
      mapCoins = 0; mapLives = 3; mapScore = 0;
      gameState = 'playing';
      updateUI();
    }

    function goToMenu() {
      gameState = 'menu';
      updateUI();
    }

    function startMap(mapNumber) {
      if (mapNumber > unlockedMaps) return;
      currentMap = mapNumber;
      fullReset();
    }

    function completeMap() {
      totalCoins += mapCoins + currentMap * 40;
      if (currentMap < 5 && currentMap === unlockedMaps) {
        unlockedMaps = Math.min(5, currentMap + 1);
      }
      gameState = 'victory';
      updateUI();
    }

    function loseLife() {
      if (gameState !== 'playing' || player.invincible > 0) return;
      mapLives--;
      player.invincible = 100;
      updateUI();
      if (mapLives <= 0) {
        gameState = 'gameover';
      } else {
        player.x = 100; player.y = GROUND_Y - 54;
        player.vx = 0; player.vy = 0;
        player.onGround = false;
        cameraX = 0;
      }
    }

    function updateUI() {
      if (gameState === 'menu') {
        coinSpan.textContent = totalCoins;
        livesSpan.textContent = '-';
        scoreSpan.textContent = '-';
        mapSpan.textContent = currentMap;
        gameControls.classList.add('hidden');
      } else {
        coinSpan.textContent = mapCoins + ' (+' + totalCoins + ')';
        livesSpan.textContent = mapLives;
        scoreSpan.textContent = mapScore;
        mapSpan.textContent = currentMap;
        gameControls.classList.remove('hidden');
      }
    }

    // ---------- КАМЕРА ----------
    function updateCamera() {
      let targetX = player.x - WORLD_W * 0.35;
      if (targetX < 0) targetX = 0;
      if (targetX > worldWidth - WORLD_W) targetX = worldWidth - WORLD_W;
      cameraX += (targetX - cameraX) * 0.12;
      if (worldWidth <= WORLD_W) cameraX = 0;
    }

    // ---------- ФИЗИКА ----------
    function applyPhysics() {
      if (gameState !== 'playing') return;
      if (player.invincible > 0) player.invincible--;

      if (keys.left) { player.vx = -player.speed; player.facing = -1; }
      else if (keys.right) { player.vx = player.speed; player.facing = 1; }
      else player.vx = 0;

      player.vy += player.gravity;
      player.y += player.vy;
      player.x += player.vx;

      if (player.x < 0) player.x = 0;
      if (player.x + player.w > worldWidth) player.x = worldWidth - player.w;

      player.onGround = false;
      for (let pl of platforms) {
        if (pl.x + pl.w < cameraX - 80 || pl.x > cameraX + WORLD_W + 80) continue;
        if (rectOverlap(player, pl)) {
          let ol = (player.x + player.w) - pl.x;
          let or = (pl.x + pl.w) - player.x;
          let ot = (player.y + player.h) - pl.y;
          let ob = (pl.y + pl.h) - player.y;
          let minX = Math.min(ol, or);
          let minY = Math.min(ot, ob);

          if (minX < minY) {
            if (ol < or) player.x = pl.x - player.w;
            else player.x = pl.x + pl.w;
            player.vx = 0;
          } else {
            if (ot < ob) {
              player.y = pl.y - player.h;
              player.vy = 0;
              player.onGround = true;
            } else {
              player.y = pl.y + pl.h;
              player.vy = 0;
            }
          }
        }
      }
      if (player.y > WORLD_H + 150) loseLife();
    }

    function updateEnemies() {
      for (let e of enemies) {
        if (!e.alive) continue;
        if (Math.abs(e.x - player.x) > 550) continue;
        e.x += e.vx;
        for (let pl of platforms) {
          if (pl.y + pl.h >= e.y + e.h - 5 && pl.y <= e.y + e.h + 10 &&
              e.x + e.w > pl.x && e.x < pl.x + pl.w) {
            if (e.x <= pl.x || e.x + e.w >= pl.x + pl.w) e.vx *= -1;
            break;
          }
        }
        if (e.x < 10 || e.x + e.w > worldWidth - 10) e.vx *= -1;
      }
      if (boss && boss.alive) {
        if (Math.abs(boss.x - player.x) < 650) boss.x += boss.vx;
        if (boss.x < cameraX + 80 || boss.x + boss.w > worldWidth - 20) boss.vx *= -1;
        if (boss.invulnerable > 0) boss.invulnerable--;
      }
    }

    function checkCollisions() {
      if (player.invincible > 0) return;
      for (let e of enemies) {
        if (!e.alive) continue;
        if (rectOverlap(player, e)) {
          if (player.vy > 0 && player.y + player.h - player.vy <= e.y + 12) {
            e.alive = false;
            player.vy = -7;
            mapScore += 100;
            updateUI();
          } else {
            loseLife();
            return;
          }
        }
      }
      if (boss && boss.alive) {
        if (rectOverlap(player, boss)) {
          if (player.vy > 0 && player.y + player.h - player.vy <= boss.y + 14 && boss.invulnerable <= 0) {
            boss.hp--;
            boss.invulnerable = 30;
            player.vy = -9;
            mapScore += 100;
            updateUI();
            if (boss.hp <= 0) {
              boss.alive = false;
              mapScore += 600;
              flag = { x: boss.x + boss.w/2 - 9, y: GROUND_Y - 100, w: 18, h: 100, flagColor: '#FFD700' };
              updateUI();
            }
          } else if (boss.invulnerable <= 0) {
            loseLife();
          }
        }
      }
    }

    function rectOverlap(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function collectCoins() {
      for (let c of coinsList) {
        if (c.collected) continue;
        let dx = player.x + player.w/2 - c.x;
        let dy = player.y + player.h/2 - c.y;
        if (Math.sqrt(dx*dx+dy*dy) < c.r + 24) {
          c.collected = true;
          mapCoins++;
          mapScore += 50;
          updateUI();
        }
      }
    }

    function checkVictory() {
      if (gameState !== 'playing' || !flag) return;
      if (rectOverlap(player, {x:flag.x, y:flag.y, w:flag.w, h:flag.h})) {
        mapScore += 1000;
        completeMap();
      }
    }

    // ---------- ОТРИСОВКА ----------
    function drawDecorations() {
      if (!mapTheme) return;
      for (let d of decorations) {
        if (d.x < cameraX - 100 || d.x > cameraX + WORLD_W + 100) continue;
        if (d.type === 'tree') {
          ctx.fillStyle = '#4a3520';
          ctx.fillRect(d.x - 6, d.y - d.h, 12, d.h);
          ctx.fillStyle = '#2d5a1e';
          ctx.beginPath();
          ctx.arc(d.x, d.y - d.h - 10, 30, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#3a7a28';
          ctx.beginPath();
          ctx.arc(d.x, d.y - d.h - 5, 22, 0, Math.PI * 2);
          ctx.fill();
        } else if (d.type === 'stalactite') {
          ctx.fillStyle = '#5a5a5a';
          ctx.beginPath();
          ctx.moveTo(d.x - 8, d.y);
          ctx.lineTo(d.x, d.y + d.h);
          ctx.lineTo(d.x + 8, d.y);
          ctx.fill();
        } else if (d.type === 'torch') {
          ctx.fillStyle = '#8B4513';
          ctx.fillRect(d.x - 2, d.y, 4, 40);
          let flicker = Math.sin(animationFrame * 0.2 + d.x) * 3;
          ctx.fillStyle = '#FF6600';
          ctx.beginPath();
          ctx.arc(d.x + flicker, d.y - 5, 8, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#FFCC00';
          ctx.beginPath();
          ctx.arc(d.x + flicker, d.y - 5, 4, 0, Math.PI * 2);
          ctx.fill();
        } else if (d.type === 'fire') {
          let flicker = Math.sin(animationFrame * 0.3 + d.x) * 5;
          ctx.fillStyle = '#FF4400';
          ctx.beginPath();
          ctx.arc(d.x + flicker, d.y - 5, 10 + Math.abs(flicker), 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#FFAA00';
          ctx.beginPath();
          ctx.arc(d.x + flicker * 0.5, d.y - 8, 6, 0, Math.PI * 2);
          ctx.fill();
        } else if (d.type === 'lava_pool') {
          ctx.fillStyle = '#FF2200';
          ctx.beginPath();
          ctx.ellipse(d.x, d.y, 25, 6, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#FFAA00';
          ctx.beginPath();
          ctx.ellipse(d.x + 5, d.y - 1, 12, 3, 0, 0, Math.PI * 2);
          ctx.fill();
        } else if (d.type === 'ice_crystal') {
          ctx.fillStyle = 'rgba(200,230,255,0.7)';
          ctx.beginPath();
          ctx.moveTo(d.x, d.y - 20);
          ctx.lineTo(d.x + 8, d.y);
          ctx.lineTo(d.x, d.y + 15);
          ctx.lineTo(d.x - 8, d.y);
          ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,0.6)';
          ctx.lineWidth = 2;
          ctx.stroke();
        } else if (d.type === 'dark_pillar') {
          ctx.fillStyle = '#1a1a3a';
          ctx.fillRect(d.x - 6, d.y - d.h, 12, d.h);
          ctx.fillStyle = '#4a006a';
          ctx.beginPath();
          ctx.arc(d.x, d.y - d.h, 10, 0, Math.PI * 2);
          ctx.fill();
        } else if (d.type === 'void_rift') {
          ctx.fillStyle = 'rgba(100,0,100,0.4)';
          ctx.beginPath();
          ctx.ellipse(d.x, d.y, 20, 5, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawWorld() {
      ctx.save();
      ctx.translate(-cameraX, 0);

      if (!mapTheme) { ctx.restore(); return; }

      // Небо
      let sky = ctx.createLinearGradient(0, 0, 0, WORLD_H);
      sky.addColorStop(0, mapTheme.skyTop);
      sky.addColorStop(0.5, mapTheme.skyBottom);
      sky.addColorStop(1, mapTheme.skyBottom);
      ctx.fillStyle = sky;
      ctx.fillRect(cameraX, 0, WORLD_W, WORLD_H);

      if (currentMap === 1 || currentMap === 4) {
        let sunGrad = ctx.createRadialGradient(200, 80, 20, 200, 80, 80);
        sunGrad.addColorStop(0, 'rgba(255,255,220,0.9)');
        sunGrad.addColorStop(0.5, 'rgba(255,255,200,0.4)');
        sunGrad.addColorStop(1, 'rgba(255,255,200,0)');
        ctx.fillStyle = sunGrad;
        ctx.beginPath();
        ctx.arc(200, 80, 80, 0, Math.PI * 2);
        ctx.fill();
      } else if (currentMap === 2 || currentMap === 5) {
        let moonGrad = ctx.createRadialGradient(1000, 100, 10, 1000, 100, 50);
        moonGrad.addColorStop(0, 'rgba(220,220,255,0.7)');
        moonGrad.addColorStop(1, 'rgba(220,220,255,0)');
        ctx.fillStyle = moonGrad;
        ctx.beginPath();
        ctx.arc(1000, 100, 50, 0, Math.PI * 2);
        ctx.fill();
      }

      if (currentMap !== 2 && currentMap !== 3 && currentMap !== 5) {
        for (let i = 0; i < worldWidth; i += 400) {
          drawCloud(i + 100, 50 + Math.sin(i * 0.03 + animationFrame * 0.01) * 25, 70);
        }
      }
      if (currentMap === 3) {
        for (let i = 0; i < worldWidth; i += 300) {
          ctx.fillStyle = 'rgba(100,50,0,0.15)';
          ctx.beginPath();
          ctx.arc(i + 80, 40 + Math.sin(i * 0.05 + animationFrame * 0.02) * 20, 40, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      drawDecorations();

      // Платформы
      for (let pl of platforms) {
        if (pl.x + pl.w < cameraX - 80 || pl.x > cameraX + WORLD_W + 80) continue;
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        roundRect(ctx, pl.x + 3, pl.y + 3, pl.w, pl.h, 6);
        ctx.fill();
        let grad = ctx.createLinearGradient(0, pl.y, 0, pl.y + pl.h);
        grad.addColorStop(0, pl.color);
        grad.addColorStop(1, '#2a1a0a');
        ctx.fillStyle = grad;
        roundRect(ctx, pl.x, pl.y, pl.w, pl.h, 6);
        ctx.fill();
        let highlight = ctx.createLinearGradient(0, pl.y, 0, pl.y + 8);
        highlight.addColorStop(0, 'rgba(255,255,255,0.3)');
        highlight.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = highlight;
        roundRect(ctx, pl.x, pl.y, pl.w, 8, 6);
        ctx.fill();
        if (pl.y === GROUND_Y) {
          ctx.fillStyle = mapTheme.groundTop;
          for (let gx = pl.x; gx < pl.x + pl.w; gx += 16) {
            ctx.beginPath();
            ctx.moveTo(gx, pl.y - 6);
            ctx.lineTo(gx + 8, pl.y - 18);
            ctx.lineTo(gx + 16, pl.y - 6);
            ctx.fill();
          }
        }
      }

      // Монеты с анимацией
      for (let c of coinsList) {
        if (c.collected || c.x < cameraX - 40 || c.x > cameraX + WORLD_W + 40) continue;
        let floatY = Math.sin(animationFrame * 0.05 + c.x) * 3;
        ctx.fillStyle = 'rgba(255,215,0,0.25)';
        ctx.beginPath();
        ctx.arc(c.x, c.y + floatY, c.r + 6, 0, Math.PI * 2);
        ctx.fill();
        let coinGrad = ctx.createRadialGradient(c.x - 3, c.y - 3 + floatY, c.r * 0.1, c.x, c.y + floatY, c.r);
        coinGrad.addColorStop(0, '#FFF');
        coinGrad.addColorStop(0.3, '#FFD700');
        coinGrad.addColorStop(1, '#B8860B');
        ctx.fillStyle = coinGrad;
        ctx.beginPath();
        ctx.arc(c.x, c.y + floatY, c.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#8B6914';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#8B6914';
        ctx.font = 'bold 12px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('$', c.x, c.y + floatY);
      }

      // Флаг
      if (flag && flag.x > cameraX - 50 && flag.x < cameraX + WORLD_W + 50) {
        ctx.fillStyle = '#888';
        roundRect(ctx, flag.x, flag.y, flag.w, flag.h, 4);
        ctx.fill();
        let flagGrad = ctx.createLinearGradient(0, flag.y, 0, flag.y + 25);
        flagGrad.addColorStop(0, flag.flagColor);
        flagGrad.addColorStop(1, '#006600');
        ctx.fillStyle = flagGrad;
        ctx.beginPath();
        ctx.moveTo(flag.x + flag.w, flag.y);
        ctx.lineTo(flag.x + flag.w + 45, flag.y + 25);
        ctx.lineTo(flag.x + flag.w, flag.y + 50);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // Враги
      for (let e of enemies) {
        if (!e.alive || e.x < cameraX - 60 || e.x > cameraX + WORLD_W + 60) continue;
        let active = Math.abs(e.x - player.x) < 550;
        let bodyGrad = ctx.createLinearGradient(0, e.y, 0, e.y + e.h);
        bodyGrad.addColorStop(0, active ? e.color : '#555');
        bodyGrad.addColorStop(1, active ? '#3d1500' : '#333');
        ctx.fillStyle = bodyGrad;
        roundRect(ctx, e.x, e.y, e.w, e.h, 8);
        ctx.fill();
        ctx.fillStyle = '#FFF';
        ctx.beginPath();
        ctx.arc(e.x + 10, e.y + 12, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(e.x + e.w - 10, e.y + 12, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(e.x + 11, e.y + 13, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(e.x + e.w - 9, e.y + 13, 4, 0, Math.PI * 2);
        ctx.fill();
        // Зрачки следят за игроком
        if (active) {
          let dx = player.x - e.x;
          let dy = player.y - e.y;
          let dist = Math.sqrt(dx*dx+dy*dy) || 1;
          let px = dx/dist * 1.5;
          let py = dy/dist * 1.5;
          ctx.fillStyle = '#FFF';
          ctx.beginPath();
          ctx.arc(e.x + 11 + px, e.y + 13 + py, 1.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(e.x + e.w - 9 + px, e.y + 13 + py, 1.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Босс
      if (boss && boss.alive && boss.x > cameraX - 100 && boss.x < cameraX + WORLD_W + 100) {
        let bc = boss.invulnerable > 0 && boss.invulnerable % 8 < 4 ? '#FFF' : boss.color;
        let bossGrad = ctx.createLinearGradient(0, boss.y, 0, boss.y + boss.h);
        bossGrad.addColorStop(0, bc);
        bossGrad.addColorStop(1, '#2a0000');
        ctx.fillStyle = bossGrad;
        roundRect(ctx, boss.x, boss.y, boss.w, boss.h, 10);
        ctx.fill();
        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.moveTo(boss.x + 2, boss.y);
        ctx.lineTo(boss.x - 8, boss.y - 28);
        ctx.lineTo(boss.x + 16, boss.y);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(boss.x + boss.w - 2, boss.y);
        ctx.lineTo(boss.x + boss.w + 8, boss.y - 28);
        ctx.lineTo(boss.x + boss.w - 16, boss.y);
        ctx.fill();
        ctx.fillStyle = '#FF0';
        ctx.beginPath();
        ctx.arc(boss.x + 16, boss.y + 20, 11, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(boss.x + boss.w - 16, boss.y + 20, 11, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(boss.x + 18, boss.y + 21, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(boss.x + boss.w - 14, boss.y + 21, 5, 0, Math.PI * 2);
        ctx.fill();
        // HP бар
        ctx.fillStyle = '#222';
        roundRect(ctx, boss.x - 2, boss.y - 22, boss.w + 4, 10, 4);
        ctx.fill();
        let hpGrad = ctx.createLinearGradient(boss.x, 0, boss.x + boss.w, 0);
        hpGrad.addColorStop(0, '#FF0000');
        hpGrad.addColorStop(1, '#00FF00');
        ctx.fillStyle = hpGrad;
        roundRect(ctx, boss.x, boss.y - 20, boss.w * (boss.hp / boss.maxHp), 8, 4);
        ctx.fill();
      }

      // Игрок
      const p = player;
      if (player.invincible > 0 && player.invincible % 8 < 4) ctx.globalAlpha = 0.5;
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(p.x + p.w/2, p.y + p.h + 3, p.w/2 + 3, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      let bodyGrad = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
      bodyGrad.addColorStop(0, '#E52521');
      bodyGrad.addColorStop(1, '#B01010');
      ctx.fillStyle = bodyGrad;
      roundRect(ctx, p.x, p.y, p.w, p.h, 7);
      ctx.fill();
      ctx.fillStyle = '#FFDAB9';
      ctx.beginPath();
      ctx.arc(p.x + p.w/2, p.y - 3, 15, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#E52521';
      ctx.beginPath();
      ctx.ellipse(p.x + p.w/2, p.y - 8, 18, 9, 0, Math.PI, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(p.facing === 1 ? p.x + p.w - 9 : p.x + 9, p.y - 5, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#FFF';
      ctx.beginPath();
      ctx.arc(p.facing === 1 ? p.x + p.w - 8 : p.x + 10, p.y - 6, 1.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#5a2d0c';
      roundRect(ctx, p.x + 9, p.y + 3, p.w - 18, 4, 2);
      ctx.fill();
      ctx.fillStyle = '#0000CD';
      ctx.fillRect(p.x + 5, p.y + p.h - 16, 12, 16);
      ctx.fillRect(p.x + p.w - 17, p.y + p.h - 16, 12, 16);
      ctx.fillStyle = '#FFD700';
      ctx.beginPath();
      ctx.arc(p.x + p.w/2, p.y + p.h - 12, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      ctx.restore();
    }

    function drawCloud(x, y, size) {
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath();
      ctx.arc(x, y, size * 0.4, 0, Math.PI * 2);
      ctx.arc(x + size * 0.3, y - size * 0.15, size * 0.35, 0, Math.PI * 2);
      ctx.arc(x + size * 0.6, y, size * 0.38, 0, Math.PI * 2);
      ctx.fill();
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function drawMenu() {
      let menuGrad = ctx.createLinearGradient(0, 0, 0, WORLD_H);
      menuGrad.addColorStop(0, '#1a1a3e');
      menuGrad.addColorStop(1, '#0a0a1a');
      ctx.fillStyle = menuGrad;
      ctx.fillRect(0, 0, WORLD_W, WORLD_H);

      ctx.fillStyle = '#FFD700';
      ctx.font = 'bold 56px "Segoe UI", Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(255,215,0,0.3)';
      ctx.shadowBlur = 30;
      ctx.fillText('PIXEL BLOCKS', WORLD_W/2, 80);
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#CCC';
      ctx.font = '22px "Segoe UI", Arial, sans-serif';
      ctx.fillText('Выбери карту', WORLD_W/2, 120);

      ctx.fillStyle = '#FFD700';
      ctx.font = 'bold 26px "Segoe UI", Arial, sans-serif';
      ctx.fillText('💰 ' + totalCoins + ' монет', WORLD_W/2, 160);

      const names = ['Лесная тропа', 'Подземелье', 'Огненный замок', 'Ледяные пики', 'Финальная битва'];
      const colors = ['#4CAF50', '#795548', '#F44336', '#2196F3', '#9C27B0'];
      const icons = ['🌿', '🕯️', '🔥', '❄️', '💀'];

      for (let i = 0; i < 5; i++) {
        let bx = 60 + (i % 3) * 400;
        let by = 195 + Math.floor(i / 3) * 250;
        let bw = 360, bh = 220;
        let locked = i + 1 > unlockedMaps;

        let cardGrad = ctx.createLinearGradient(0, by, 0, by + bh);
        cardGrad.addColorStop(0, locked ? '#2a2a3a' : colors[i]);
        cardGrad.addColorStop(1, locked ? '#1a1a2a' : '#1a1a2a');
        ctx.fillStyle = cardGrad;
        roundRect(ctx, bx, by, bw, bh, 20);
        ctx.fill();

        ctx.strokeStyle = (i + 1 === currentMap && !locked) ? '#FFD700' : '#444';
        ctx.lineWidth = 3;
        roundRect(ctx, bx, by, bw, bh, 20);
        ctx.stroke();

        ctx.fillStyle = locked ? '#777' : '#FFF';
        ctx.font = 'bold 28px "Segoe UI", Arial, sans-serif';
        ctx.fillText(icons[i] + ' Карта ' + (i + 1), bx + bw/2, by + 45);
        ctx.font = '20px "Segoe UI", Arial, sans-serif';
        ctx.fillText(names[i], bx + bw/2, by + 85);

        let diff = '';
        if (!locked) {
          if (i === 0) diff = 'Лёгкая';
          else if (i === 1) diff = 'Средняя';
          else if (i === 2) diff = 'Сложная';
          else if (i === 3) diff = 'Очень сложная';
          else diff = 'Экстрим';
        } else {
          diff = 'Закрыта';
        }
        ctx.font = 'bold 17px "Segoe UI", Arial, sans-serif';
        ctx.fillText(diff, bx + bw/2, by + 130);

        if (!locked) {
          let btnGrad = ctx.createLinearGradient(0, by + 150, 0, by + 190);
          btnGrad.addColorStop(0, '#FFD700');
          btnGrad.addColorStop(1, '#FF8C00');
          ctx.fillStyle = btnGrad;
          roundRect(ctx, bx + bw/2 - 55, by + 160, 110, 38, 19);
          ctx.fill();
          ctx.fillStyle = '#000';
          ctx.font = 'bold 20px "Segoe UI", Arial, sans-serif';
          ctx.fillText('ИГРАТЬ', bx + bw/2, by + 184);
        }
      }

      ctx.fillStyle = '#AAA';
      ctx.font = '14px "Segoe UI", Arial, sans-serif';
      ctx.fillText('Кликни на карту чтобы играть', WORLD_W/2, WORLD_H - 25);
    }

    function drawOverlay() {
      if (gameState === 'gameover') {
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(0, 0, WORLD_W, WORLD_H);
        ctx.fillStyle = '#FFF';
        ctx.font = 'bold 60px "Segoe UI", Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', WORLD_W/2, WORLD_H/2 - 15);
        ctx.font = '22px "Segoe UI", Arial, sans-serif';
        ctx.fillText('↺ или R — попробовать снова', WORLD_W/2, WORLD_H/2 + 40);
      } else if (gameState === 'victory') {
        ctx.fillStyle = 'rgba(255,215,0,0.9)';
        ctx.fillRect(0, 0, WORLD_W, WORLD_H);
        ctx.fillStyle = '#000';
        ctx.font = 'bold 64px "Segoe UI", Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('ПОБЕДА!', WORLD_W/2, WORLD_H/2 - 30);
        ctx.font = '28px "Segoe UI", Arial, sans-serif';
        ctx.fillText('Карта ' + currentMap + ' пройдена!', WORLD_W/2, WORLD_H/2 + 30);
      }
    }

    // ---------- РАЗМЕР КАНВАСА ----------
    function resizeCanvas() {
      const wrapper = document.getElementById('gameWrapper');
      const w = wrapper.clientWidth;
      const h = wrapper.clientHeight;

      const sx = w / WORLD_W;
      const sy = h / WORLD_H;
      const s = Math.min(sx, sy);

      const cw = WORLD_W * s;
      const ch = WORLD_H * s;

      canvas.style.width = cw + 'px';
      canvas.style.height = ch + 'px';
      canvas.width = cw * devicePixelRatio;
      canvas.height = ch * devicePixelRatio;

      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      ctx.scale(s, s);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
    }

    // ---------- ИГРОВОЙ ЦИКЛ ----------
    function gameLoop() {
      animationFrame++;
      resizeCanvas();

      if (gameState === 'playing') {
        applyPhysics();
        updateCamera();
        updateEnemies();
        checkCollisions();
        collectCoins();
        checkVictory();
        drawWorld();
        updateUI();
      } else if (gameState === 'menu') {
        drawMenu();
      } else {
        drawWorld();
        drawOverlay();
      }

      requestAnimationFrame(gameLoop);
    }

    // ---------- УПРАВЛЕНИЕ ----------
    const keys = { left: false, right: false, jump: false };

    function doJump() {
      if (gameState === 'playing' && player.onGround) {
        player.vy = player.jumpPower;
        player.onGround = false;
      }
    }

    window.addEventListener('keydown', (e) => {
      if (gameState === 'menu') {
        if (e.key >= '1' && e.key <= '5') startMap(parseInt(e.key));
        return;
      }
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') {
        keys.jump = true;
        doJump();
      }
      if (e.key === 'r' || e.key === 'R') {
        if (gameState === 'gameover' || gameState === 'victory' || gameState === 'playing') fullReset();
      }
      if (e.key === 'Escape') goToMenu();
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') keys.jump = false;
    });

    canvas.addEventListener('click', (e) => {
      if (gameState !== 'menu') return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = WORLD_W / rect.width;
      const scaleY = WORLD_H / rect.height;
      const mx = (e.clientX - rect.left) * scaleX;
      const my = (e.clientY - rect.top) * scaleY;
      for (let i = 0; i < 5; i++) {
        let bx = 60 + (i % 3) * 400;
        let by = 195 + Math.floor(i / 3) * 250;
        if (mx >= bx && mx <= bx + 360 && my >= by && my <= by + 220 && i + 1 <= unlockedMaps) {
          startMap(i + 1);
          return;
        }
      }
    });

    function setupBtn(id, action) {
      const btn = document.getElementById(id);
      if (!btn) return;
      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault(); e.stopPropagation();
        btn.classList.add('pressed');
        if (action === 'menu') goToMenu();
        else if (action === 'restart') {
          if (gameState === 'gameover' || gameState === 'victory' || gameState === 'playing') fullReset();
        } else if (action === 'left' && gameState === 'playing') keys.left = true;
        else if (action === 'right' && gameState === 'playing') keys.right = true;
        else if ((action === 'up' || action === 'jump') && gameState === 'playing') {
          keys.jump = true;
          doJump();
        }
      });
      btn.addEventListener('pointerup', (e) => {
        e.preventDefault(); e.stopPropagation();
        btn.classList.remove('pressed');
        if (action === 'left') keys.left = false;
        if (action === 'right') keys.right = false;
        if (action === 'up' || action === 'jump') keys.jump = false;
      });
      btn.addEventListener('pointerleave', () => {
        btn.classList.remove('pressed');
        if (action === 'left') keys.left = false;
        if (action === 'right') keys.right = false;
        if (action === 'up' || action === 'jump') keys.jump = false;
      });
    }

    setupBtn('btnLeft', 'left');
    setupBtn('btnRight', 'right');
    setupBtn('btnUp', 'up');
    setupBtn('btnJump', 'jump');
    setupBtn('btnRestart', 'restart');
    setupBtn('btnMenu', 'menu');

    document.addEventListener('touchmove', (e) => {
      if (e.target.closest('.ctrl-btn')) e.preventDefault();
    }, { passive: false });

    function checkOrientation() {
      const isLandscape = window.innerWidth > window.innerHeight;
      if (isLandscape) {
        document.getElementById('rotateScreen').style.display = 'none';
        document.getElementById('gameWrapper').style.display = 'flex';
        // Принудительный ресайз после смены ориентации
        setTimeout(resizeCanvas, 100);
      } else {
        document.getElementById('rotateScreen').style.display = 'flex';
        document.getElementById('gameWrapper').style.display = 'none';
      }
    }

    window.addEventListener('orientationchange', () => {
      setTimeout(checkOrientation, 200);
    });
    window.addEventListener('resize', () => {
      if (window.innerWidth > window.innerHeight) {
        document.getElementById('rotateScreen').style.display = 'none';
        document.getElementById('gameWrapper').style.display = 'flex';
      }
      resizeCanvas();
    });
    checkOrientation();

    updateUI();
    gameLoop();
  })();
