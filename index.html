<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pixel Blocks — Платформер</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
    html, body { width:100%; height:100%; overflow:hidden; background:#0a0a1a; font-family:'Segoe UI','Arial',sans-serif; touch-action:manipulation; position:fixed; }
    .rotate-screen {
      display: flex; position:fixed; top:0; left:0; width:100vw; height:100vh; height:100dvh;
      background:#0a0a1a; z-index:1000; flex-direction:column; justify-content:center; align-items:center; gap:20px;
    }
    .rotate-screen .phone-icon { font-size:80px; animation:rotate-phone 2s ease-in-out infinite; }
    @keyframes rotate-phone { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(90deg)} }
    .rotate-screen h2 { color:#FFD700; font-size:24px; text-align:center; font-weight:600; }
    .rotate-screen p { color:#aaa; font-size:16px; text-align:center; }
    .game-wrapper { display:none; width:100vw; height:100vh; height:100dvh; overflow:hidden; position:fixed; top:0; left:0; background:#5c94fc; justify-content:center; align-items:center; }
    canvas { display:block; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:#5c94fc; }
    .hud { position:absolute; top:12px; left:50%; transform:translateX(-50%); display:flex; gap:16px; background:rgba(10,10,26,0.85); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); padding:8px 20px; border-radius:25px; border:1px solid rgba(255,255,255,0.2); z-index:10; color:#fff; font-size:14px; font-weight:600; pointer-events:none; }
    .game-controls { position:absolute; bottom:16px; left:20px; right:20px; display:flex; justify-content:space-between; align-items:flex-end; z-index:20; pointer-events:none; }
    .dpad { display:flex; flex-direction:column; align-items:center; gap:4px; pointer-events:auto; }
    .dpad-row { display:flex; gap:4px; }
    .action-row { display:flex; gap:8px; align-items:center; pointer-events:auto; }
    .ctrl-btn { width:44px; height:44px; border-radius:14px; border:2px solid rgba(255,255,255,0.3); background:rgba(255,255,255,0.12); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); color:#fff; font-size:20px; display:flex; align-items:center; justify-content:center; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; transition:all 0.1s; font-weight:bold; }
    .ctrl-btn:active,.ctrl-btn.pressed { background:rgba(255,215,0,0.8); color:#000; border-color:#fff; transform:scale(0.9); }
    .jump-btn { width:58px; height:58px; border-radius:50%; font-size:16px; font-weight:800; background:rgba(220,50,50,0.55); border-color:rgba(255,100,100,0.6); }
    .small-btn { width:38px; height:38px; border-radius:10px; font-size:16px; background:rgba(100,100,255,0.35); }
    .hidden { display:none!important; }
  </style>
</head>
<body>
<div class="rotate-screen" id="rotateScreen"><div class="phone-icon">📱</div><h2>Поверните телефон</h2><p>Для игры нужна альбомная ориентация</p></div>
<div class="game-wrapper" id="gameWrapper">
  <canvas id="gameCanvas"></canvas>
  <div class="hud hidden" id="hudBar"><span>🪙 <span id="coinCounter">0</span></span><span>❤️ <span id="livesCounter">3</span></span><span>⭐ <span id="scoreCounter">0</span></span><span>🗺️ <span id="mapCounter">1</span></span></div>
  <div class="game-controls hidden" id="gameControls">
    <div class="dpad"><div class="ctrl-btn" id="btnUp">▲</div><div class="dpad-row"><div class="ctrl-btn" id="btnLeft">◀</div><div class="ctrl-btn" id="btnRight">▶</div></div></div>
    <div class="action-row"><div class="ctrl-btn small-btn" id="btnUse">🎒</div><div class="ctrl-btn small-btn" id="btnMenu">🏠</div><div class="ctrl-btn small-btn" id="btnRestart">↺</div><div class="ctrl-btn jump-btn" id="btnJump">ПРЫГ</div></div>
  </div>
</div>
<script>
(function(){
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
const hudBar=document.getElementById('hudBar'),gameControls=document.getElementById('gameControls'),gameWrapper=document.getElementById('gameWrapper');
const rotateScreen=document.getElementById('rotateScreen');
const coinSpan=document.getElementById('coinCounter'),livesSpan=document.getElementById('livesCounter'),scoreSpan=document.getElementById('scoreCounter'),mapSpan=document.getElementById('mapCounter');
const WORLD_W=1280,WORLD_H=720,GROUND_Y=WORLD_H-70;

let inventory=[{name:'Сила',icon:'💪',count:1,type:'power'},{name:null,icon:'',count:0,type:null},{name:null,icon:'',count:0,type:null},{name:null,icon:'',count:0,type:null},{name:null,icon:'',count:0,type:null}];
let activeSlot=0,powerActive=false,powerTimer=0,totalCoins=0,currentMap=1,unlockedMaps=1,gameState='main';
const player={x:100,y:GROUND_Y-54,w:40,h:54,vx:0,vy:0,speed:7,jumpPower:-13.5,gravity:0.78,onGround:false,facing:1,invincible:0};
let worldWidth=4000,cameraX=0,mapTheme=null,platforms=[],coinsList=[],enemies=[],itemsList=[],boss=null,flag=null,decorations=[],animationFrame=0,mapCoins=0,mapLives=3,mapScore=0;

const themes={
1:{name:'Лесная тропа',skyTop:'#4a90d9',skyBottom:'#b8e6ff',groundColor:'#5a8f3d',groundTop:'#4CAF50',platformColor:'#8B5E3C',enemyColor:'#8B4513',boss:false,decorations:'forest',worldLength:3500,numPlatforms:12,numCoins:18,numEnemies:5,enemySpeed:1.8},
2:{name:'Подземелье',skyTop:'#1a1a2e',skyBottom:'#2d2d44',groundColor:'#4a4a4a',groundTop:'#666',platformColor:'#5c4a3a',enemyColor:'#6B3A2A',boss:true,bossHP:3,decorations:'cave',worldLength:4200,numPlatforms:14,numCoins:22,numEnemies:7,enemySpeed:2.2},
3:{name:'Огненный замок',skyTop:'#2d0000',skyBottom:'#4a0000',groundColor:'#3d1a1a',groundTop:'#8B0000',platformColor:'#5c3030',enemyColor:'#8B0000',boss:true,bossHP:4,decorations:'fire',worldLength:5000,numPlatforms:16,numCoins:26,numEnemies:9,enemySpeed:2.6},
4:{name:'Ледяные пики',skyTop:'#1a3a5c',skyBottom:'#a8d8ea',groundColor:'#b8d8f0',groundTop:'#e8f4f8',platformColor:'#c8e8f8',enemyColor:'#4a7a9a',boss:true,bossHP:5,decorations:'ice',worldLength:5800,numPlatforms:18,numCoins:30,numEnemies:11,enemySpeed:3.0},
5:{name:'Финальная битва',skyTop:'#0a001a',skyBottom:'#2a004a',groundColor:'#1a1a3a',groundTop:'#4a4a8a',platformColor:'#3a3a5a',enemyColor:'#4a006a',boss:true,bossHP:6,decorations:'final',worldLength:6600,numPlatforms:20,numCoins:34,numEnemies:13,enemySpeed:3.5}
};

let uiButtons=[];
function buildMainMenu(){uiButtons=[{text:'🎮 Играть',x:WORLD_W/2-130,y:250,w:260,h:60,action:'maps'},{text:'🎒 Инвентарь',x:WORLD_W/2-130,y:340,w:260,h:60,action:'inventory'}];}
function buildMapSelect(){
  uiButtons=[];
  const names=['Лесная тропа','Подземелье','Огненный замок','Ледяные пики','Финальная битва'],colors=['#4CAF50','#795548','#F44336','#2196F3','#9C27B0'],icons=['🌿','🕯️','🔥','❄️','💀'];
  for(let i=0;i<5;i++){let bx=60+(i%3)*400,by=120+Math.floor(i/3)*260,bw=360,bh=230;uiButtons.push({text:icons[i]+' Карта '+(i+1)+' - '+names[i],x:bx,y:by,w:bw,h:bh,action:'startMap',mapNum:i+1,locked:i+1>unlockedMaps,color:colors[i]});}
  uiButtons.push({text:'🔙 Назад',x:WORLD_W/2-80,y:WORLD_H-60,w:160,h:45,action:'main'});
}
function buildInventory(){
  uiButtons=[];
  for(let i=0;i<5;i++){uiButtons.push({text:inventory[i].name?inventory[i].icon+' '+inventory[i].name:'Пусто',x:WORLD_W/2-200+i*90,y:300,w:70,h:70,action:'selectSlot',slot:i,count:inventory[i].count});}
  uiButtons.push({text:'Использовать',x:WORLD_W/2-100,y:420,w:200,h:50,action:'useItem'});
  uiButtons.push({text:'🔙 Назад',x:WORLD_W/2-80,y:WORLD_H-60,w:160,h:45,action:'main'});
}
function buildGameOver(){uiButtons=[{text:'🔄 Попробовать снова',x:WORLD_W/2-140,y:WORLD_H/2+60,w:280,h:55,action:'restart'},{text:'🏠 Выйти в меню',x:WORLD_W/2-140,y:WORLD_H/2+130,w:280,h:55,action:'main'}];}
function buildVictory(){uiButtons=[{text:'🔄 Играть ещё раз',x:WORLD_W/2-140,y:WORLD_H/2+50,w:280,h:55,action:'restart'},{text:'▶️ Следующая карта',x:WORLD_W/2-140,y:WORLD_H/2+120,w:280,h:55,action:'nextMap'},{text:'🏠 Выйти в меню',x:WORLD_W/2-140,y:WORLD_H/2+190,w:280,h:55,action:'main'}];}

function generateMap(mapNumber){
  platforms=[];coinsList=[];enemies=[];itemsList=[];boss=null;flag=null;decorations=[];
  const t=themes[mapNumber];mapTheme=t;worldWidth=t.worldLength;
  for(let i=0;i<worldWidth;i+=400) platforms.push({x:i,y:GROUND_Y,w:Math.min(400,worldWidth-i),h:70,color:t.groundColor,isGround:true});
  if(t.decorations==='forest'){for(let i=0;i<worldWidth;i+=250+Math.random()*200)decorations.push({type:'tree',x:i,y:GROUND_Y,h:100+Math.random()*80});}
  else if(t.decorations==='cave'){for(let i=0;i<worldWidth;i+=200+Math.random()*200)decorations.push({type:'stalactite',x:i,y:0,h:50+Math.random()*90});for(let i=0;i<worldWidth;i+=350)decorations.push({type:'torch',x:i+150,y:GROUND_Y-170});}
  else if(t.decorations==='fire'){for(let i=0;i<worldWidth;i+=200+Math.random()*150)decorations.push({type:'fire',x:i,y:GROUND_Y-20});}
  else if(t.decorations==='ice'){for(let i=0;i<worldWidth;i+=250+Math.random()*200)decorations.push({type:'ice_crystal',x:i,y:GROUND_Y-120-Math.random()*180});}
  else if(t.decorations==='final'){for(let i=0;i<worldWidth;i+=350+Math.random()*150)decorations.push({type:'dark_pillar',x:i,y:GROUND_Y-130,h:80+Math.random()*70});}

  let occupied=[{x:0,y:GROUND_Y,w:worldWidth,h:70}];
  function overlaps(x,y,w,h){for(let r of occupied){if(x<r.x+r.w+20&&x+w>r.x-20&&y<r.y+r.h+15&&y+h>r.y-15)return true;}return false;}

  let zones=5;
  let zoneWidth=(worldWidth-200)/zones;
  for(let z=0;z<zones;z++){
    let zoneStart=100+z*zoneWidth,zoneEnd=zoneStart+zoneWidth;
    let numInZone=Math.floor(t.numPlatforms/zones)+(z<t.numPlatforms%zones?1:0);
    let zoneHeight=GROUND_Y-60-z*45;if(zoneHeight<100)zoneHeight=100;
    let platWidth=110+Math.random()*60,gap=30+Math.random()*40;
    let totalWidth=numInZone*(platWidth+gap);
    let startX=zoneStart+(zoneWidth-totalWidth)/2;if(startX<zoneStart+20)startX=zoneStart+20;
    for(let i=0;i<numInZone;i++){
      let px=startX+i*(platWidth+gap),py=zoneHeight+Math.random()*30;
      let pw=platWidth+Math.random()*40;if(px+pw>zoneEnd-20)pw=zoneEnd-20-px;if(pw<70)pw=70;
      if(!overlaps(px,py,pw,20)){platforms.push({x:px,y:py,w:pw,h:20,color:t.platformColor,isGround:false});occupied.push({x:px,y:py,w:pw,h:20});}
    }
  }
  for(let i=0;i<5;i++){let px=200+Math.random()*(worldWidth-400),py=GROUND_Y-180-Math.random()*100,pw=90+Math.random()*80;if(px<50)px=50;if(px+pw>worldWidth-50)px=worldWidth-pw-50;if(!overlaps(px,py,pw,20)){platforms.push({x:px,y:py,w:pw,h:20,color:t.platformColor,isGround:false});occupied.push({x:px,y:py,w:pw,h:20});}}
  platforms.sort((a,b)=>a.y-b.y);

  for(let i=0;i<t.numCoins;i++){let pl=platforms[Math.floor(Math.random()*platforms.length)],cx=pl.x+20+Math.random()*(pl.w-40),cy=pl.y-30-Math.random()*100;if(cy<30)cy=30;coinsList.push({x:cx,y:cy,r:13,collected:false});}
  for(let i=0;i<2+mapNumber;i++){let pl=platforms[Math.floor(Math.random()*platforms.length)];itemsList.push({x:pl.x+pl.w/2,y:pl.y-35,r:12,collected:false,type:'potion'});}
  let validPlats=platforms.filter(p=>p.w>=90);
  for(let i=0;i<t.numEnemies;i++){let pl=validPlats[Math.floor(Math.random()*validPlats.length)],ex=pl.x+20+Math.random()*(pl.w-70),speed=t.enemySpeed+Math.random()*2;if(Math.random()<0.5)speed*=-1;enemies.push({x:ex,y:pl.y-38,w:36,h:38,vx:speed,color:t.enemyColor,alive:true,platform:pl});}
  const finishX=worldWidth-300;
  if(t.boss){platforms.push({x:finishX-60,y:GROUND_Y-80,w:240,h:24,color:'#555',isGround:false});boss={x:finishX-20,y:GROUND_Y-150,w:64,h:74,vx:3+mapNumber*0.9,hp:t.bossHP,maxHp:t.bossHP,color:t.enemyColor,alive:true,invulnerable:0};}
  else{platforms.push({x:finishX-40,y:GROUND_Y-110,w:140,h:24,color:'#DAA520',isGround:false});flag={x:finishX+30,y:GROUND_Y-100,w:18,h:100,flagColor:'#00FF00'};}
}

function addToInventory(item){let found=inventory.find(s=>s.name===item.name&&s.type===item.type);if(found){found.count++;}else{let empty=inventory.find(s=>s.name===null);if(empty){empty.name=item.name;empty.icon=item.icon;empty.count=1;empty.type=item.type;}}}
function useActiveItem(){if(gameState!=='playing')return;let item=inventory[activeSlot];if(!item.name)return;if(item.type==='power'){powerActive=true;powerTimer=180;player.speed=10;player.jumpPower=-16;item.count--;if(item.count<=0){item.name=null;item.icon='';item.count=0;item.type=null;}}else if(item.type==='potion'){mapLives=Math.min(5,mapLives+1);item.count--;if(item.count<=0){item.name=null;item.icon='';item.count=0;item.type=null;}updateUI();}}
function fullReset(){player.x=100;player.y=GROUND_Y-54;player.vx=0;player.vy=0;player.onGround=false;player.facing=1;player.invincible=0;player.speed=7;player.jumpPower=-13.5;powerActive=false;powerTimer=0;cameraX=0;generateMap(currentMap);mapCoins=0;mapLives=3;mapScore=0;gameState='playing';uiButtons=[];updateUI();}
function startMap(mn){if(mn>unlockedMaps)return;currentMap=mn;fullReset();}
function completeMap(){totalCoins+=mapCoins+currentMap*40;if(currentMap<5&&currentMap===unlockedMaps)unlockedMaps=Math.min(5,currentMap+1);gameState='victory';buildVictory();updateUI();}
function loseLife(){if(gameState!=='playing'||player.invincible>0)return;mapLives--;player.invincible=100;updateUI();if(mapLives<=0){gameState='gameover';buildGameOver();}else{player.x=100;player.y=GROUND_Y-54;player.vx=0;player.vy=0;player.onGround=false;cameraX=0;}}
function updateUI(){if(gameState==='playing'){coinSpan.textContent=mapCoins+' (+'+totalCoins+')';livesSpan.textContent=mapLives;scoreSpan.textContent=mapScore;mapSpan.textContent=currentMap;hudBar.classList.remove('hidden');gameControls.classList.remove('hidden');}else if(gameState==='gameover'||gameState==='victory'){coinSpan.textContent=mapCoins+' (+'+totalCoins+')';livesSpan.textContent=mapLives;scoreSpan.textContent=mapScore;mapSpan.textContent=currentMap;hudBar.classList.remove('hidden');gameControls.classList.add('hidden');}else{hudBar.classList.add('hidden');gameControls.classList.add('hidden');}}
function goToMain(){gameState='main';uiButtons=[];buildMainMenu();updateUI();}
function updateCamera(){let tx=player.x-WORLD_W*0.35;if(tx<0)tx=0;if(tx>worldWidth-WORLD_W)tx=worldWidth-WORLD_W;cameraX+=(tx-cameraX)*0.12;if(worldWidth<=WORLD_W)cameraX=0;}

function applyPhysics(){if(gameState!=='playing')return;if(player.invincible>0)player.invincible--;if(powerActive){powerTimer--;if(powerTimer<=0){powerActive=false;player.speed=7;player.jumpPower=-13.5;}}if(keys.left){player.vx=-player.speed;player.facing=-1;}else if(keys.right){player.vx=player.speed;player.facing=1;}else player.vx=0;player.vy+=player.gravity;player.y+=player.vy;player.x+=player.vx;if(player.x<0)player.x=0;if(player.x+player.w>worldWidth)player.x=worldWidth-player.w;player.onGround=false;let pBottom=player.y+player.h,pPrevBottom=pBottom-player.vy;for(let pl of platforms){if(pl.x+pl.w<cameraX-80||pl.x>cameraX+WORLD_W+80)continue;if(!rectOverlap(player,pl))continue;let ol=(player.x+player.w)-pl.x,or=(pl.x+pl.w)-player.x,ot=pBottom-pl.y,ob=(pl.y+pl.h)-player.y;if(Math.min(ol,or)<Math.min(ot,ob)){if(ol<or)player.x=pl.x-player.w;else player.x=pl.x+pl.w;player.vx=0;}else{if(ot<ob){if(pPrevBottom<=pl.y+4||player.vy>=0){player.y=pl.y-player.h;player.vy=0;player.onGround=true;}}else{if(player.vy<0){player.y=pl.y+pl.h;player.vy=0;}}}}if(player.y>WORLD_H+150)loseLife();}
function updateEnemies(){for(let e of enemies){if(!e.alive)continue;if(Math.abs(e.x-player.x)>550)continue;e.x+=e.vx;if(e.platform){if(e.x<e.platform.x||e.x+e.w>e.platform.x+e.platform.w)e.vx*=-1;}if(e.x<10||e.x+e.w>worldWidth-10)e.vx*=-1;}if(boss&&boss.alive){if(Math.abs(boss.x-player.x)<650)boss.x+=boss.vx;if(boss.x<cameraX+80||boss.x+boss.w>worldWidth-20)boss.vx*=-1;if(boss.invulnerable>0)boss.invulnerable--;}}
function checkCollisions(){if(player.invincible>0)return;for(let e of enemies){if(!e.alive)continue;if(rectOverlap(player,e)){if(player.vy>0&&player.y+player.h-player.vy<=e.y+12){e.alive=false;player.vy=-7;mapScore+=100;updateUI();}else{loseLife();return;}}}if(boss&&boss.alive&&rectOverlap(player,boss)){if(player.vy>0&&player.y+player.h-player.vy<=boss.y+14&&boss.invulnerable<=0){boss.hp--;boss.invulnerable=30;player.vy=-9;mapScore+=100;updateUI();if(boss.hp<=0){boss.alive=false;mapScore+=600;flag={x:boss.x+boss.w/2-9,y:GROUND_Y-100,w:18,h:100,flagColor:'#FFD700'};updateUI();}}else if(boss.invulnerable<=0){loseLife();}}}
function rectOverlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function collectItems(){for(let item of itemsList){if(item.collected)continue;if(Math.hypot(player.x+player.w/2-item.x,player.y+player.h/2-item.y)<item.r+22){item.collected=true;addToInventory({name:'Зелье лечения',icon:'🧪',type:'potion'});}}for(let c of coinsList){if(c.collected)continue;if(Math.hypot(player.x+player.w/2-c.x,player.y+player.h/2-c.y)<c.r+24){c.collected=true;mapCoins++;mapScore+=50;updateUI();}}}
function checkVictory(){if(gameState!=='playing'||!flag)return;if(rectOverlap(player,{x:flag.x,y:flag.y,w:flag.w,h:flag.h})){mapScore+=1000;completeMap();}}

function drawWorld(){
  ctx.save();ctx.translate(-cameraX,0);if(!mapTheme){ctx.restore();return;}
  let sky=ctx.createLinearGradient(0,0,0,WORLD_H);sky.addColorStop(0,mapTheme.skyTop);sky.addColorStop(0.5,mapTheme.skyBottom);sky.addColorStop(1,mapTheme.skyBottom);ctx.fillStyle=sky;ctx.fillRect(cameraX,0,WORLD_W,WORLD_H);
  if(currentMap===1||currentMap===4){let sg=ctx.createRadialGradient(200,80,20,200,80,80);sg.addColorStop(0,'rgba(255,255,220,0.9)');sg.addColorStop(1,'rgba(255,255,200,0)');ctx.fillStyle=sg;ctx.beginPath();ctx.arc(200,80,80,0,Math.PI*2);ctx.fill();}
  if(currentMap!==2&&currentMap!==3&&currentMap!==5){for(let i=0;i<worldWidth;i+=400)drawCloud(i+100,50+Math.sin(i*0.03+animationFrame*0.01)*25,70);}

  if(boss&&boss.alive&&boss.x>cameraX-100&&boss.x<cameraX+WORLD_W+100){let bc=boss.invulnerable>0&&boss.invulnerable%8<4?'#FFF':boss.color;ctx.fillStyle=bc;roundRect(ctx,boss.x,boss.y,boss.w,boss.h,10);ctx.fill();ctx.fillStyle='#333';ctx.beginPath();ctx.moveTo(boss.x+2,boss.y);ctx.lineTo(boss.x-8,boss.y-28);ctx.lineTo(boss.x+16,boss.y);ctx.fill();ctx.beginPath();ctx.moveTo(boss.x+boss.w-2,boss.y);ctx.lineTo(boss.x+boss.w+8,boss.y-28);ctx.lineTo(boss.x+boss.w-16,boss.y);ctx.fill();ctx.fillStyle='#FF0';ctx.beginPath();ctx.arc(boss.x+16,boss.y+20,11,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(boss.x+boss.w-16,boss.y+20,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(boss.x+18,boss.y+21,5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(boss.x+boss.w-14,boss.y+21,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#222';roundRect(ctx,boss.x-2,boss.y-22,boss.w+4,10,4);ctx.fill();ctx.fillStyle=boss.hp>boss.maxHp/2?'#0F0':'#F00';roundRect(ctx,boss.x,boss.y-20,boss.w*(boss.hp/boss.maxHp),8,4);ctx.fill();}

function drawCloud(x,y,s){ctx.fillStyle='rgba(255,255,255,0.85)';ctx.beginPath();ctx.arc(x,y,s*0.4,0,Math.PI*2);ctx.arc(x+s*0.3,y-s*0.15,s*0.35,0,Math.PI*2);ctx.arc(x+s*0.6,y,s*0.38,0,Math.PI*2);ctx.fill();}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function drawUI(){if(gameState==='main')drawMainMenu();else if(gameState==='maps')drawMapSelect();else if(gameState==='inventory')drawInventory();}
function drawMainMenu(){let mg=ctx.createLinearGradient(0,0,0,WORLD_H);mg.addColorStop(0,'#1a1a3e');mg.addColorStop(1,'#0a0a1a');ctx.fillStyle=mg;ctx.fillRect(0,0,WORLD_W,WORLD_H);ctx.fillStyle='#FFD700';ctx.font='bold 56px "Segoe UI",Arial,sans-serif';ctx.textAlign='center';ctx.fillText('PIXEL BLOCKS',WORLD_W/2,130);ctx.fillStyle='#CCC';ctx.font='20px "Segoe UI",Arial,sans-serif';ctx.fillText('💰 '+totalCoins+' монет',WORLD_W/2,180);drawButtons();}
function drawMapSelect(){let mg=ctx.createLinearGradient(0,0,0,WORLD_H);mg.addColorStop(0,'#1a1a3e');mg.addColorStop(1,'#0a0a1a');ctx.fillStyle=mg;ctx.fillRect(0,0,WORLD_W,WORLD_H);ctx.fillStyle='#FFD700';ctx.font='bold 42px "Segoe UI",Arial,sans-serif';ctx.textAlign='center';ctx.fillText('Выбери карту',WORLD_W/2,55);ctx.fillStyle='#CCC';ctx.font='16px "Segoe UI",Arial,sans-serif';ctx.fillText('💰 '+totalCoins+' монет',WORLD_W/2,85);const names=['Лесная тропа','Подземелье','Огненный замок','Ледяные пики','Финальная битва'];for(let i=0;i<5;i++){let btn=uiButtons[i];if(!btn)continue;let locked=i+1>unlockedMaps;let cg=ctx.createLinearGradient(0,btn.y,0,btn.y+btn.h);cg.addColorStop(0,locked?'#2a2a3a':btn.color);cg.addColorStop(1,locked?'#1a1a2a':'#111');ctx.fillStyle=cg;roundRect(ctx,btn.x,btn.y,btn.w,btn.h,20);ctx.fill();ctx.strokeStyle=(i+1===currentMap&&!locked)?'#FFD700':'#444';ctx.lineWidth=2.5;roundRect(ctx,btn.x,btn.y,btn.w,btn.h,20);ctx.stroke();ctx.fillStyle=locked?'#777':'#FFF';ctx.font='bold 24px "Segoe UI",Arial,sans-serif';ctx.fillText('Карта '+(i+1),btn.x+btn.w/2,btn.y+45);ctx.font='18px "Segoe UI",Arial,sans-serif';ctx.fillText(names[i],btn.x+btn.w/2,btn.y+85);if(!locked){ctx.fillStyle='#FFD700';roundRect(ctx,btn.x+btn.w/2-50,btn.y+170,100,34,17);ctx.fill();ctx.fillStyle='#000';ctx.font='bold 18px "Segoe UI",Arial,sans-serif';ctx.fillText('ИГРАТЬ',btn.x+btn.w/2,btn.y+192);}else{ctx.fillStyle='#999';ctx.font='16px "Segoe UI",Arial,sans-serif';ctx.fillText('🔒 Закрыта',btn.x+btn.w/2,btn.y+190);}}let backBtn=uiButtons[uiButtons.length-1];ctx.fillStyle='#FFD700';roundRect(ctx,backBtn.x,backBtn.y,backBtn.w,backBtn.h,16);ctx.fill();ctx.fillStyle='#000';ctx.font='bold 20px "Segoe UI",Arial,sans-serif';ctx.fillText(backBtn.text,backBtn.x+backBtn.w/2,backBtn.y+backBtn.h/2+7);}
function drawInventory(){let mg=ctx.createLinearGradient(0,0,0,WORLD_H);mg.addColorStop(0,'#1a1a3e');mg.addColorStop(1,'#0a0a1a');ctx.fillStyle=mg;ctx.fillRect(0,0,WORLD_W,WORLD_H);ctx.fillStyle='#FFD700';ctx.font='bold 42px "Segoe UI",Arial,sans-serif';ctx.textAlign='center';ctx.fillText('🎒 Инвентарь',WORLD_W/2,70);ctx.fillStyle='#CCC';ctx.font='16px "Segoe UI",Arial,sans-serif';ctx.fillText('💰 '+totalCoins+' монет',WORLD_W/2,105);for(let i=0;i<5;i++){let s=uiButtons[i];let bg=ctx.createLinearGradient(0,s.y,0,s.y+s.h);bg.addColorStop(0,activeSlot===i?'#FFD700':'#333');bg.addColorStop(1,activeSlot===i?'#FF8C00':'#222');ctx.fillStyle=bg;roundRect(ctx,s.x,s.y,s.w,s.h,14);ctx.fill();ctx.strokeStyle=activeSlot===i?'#FFF':'#555';ctx.lineWidth=2;roundRect(ctx,s.x,s.y,s.w,s.h,14);ctx.stroke();if(inventory[i].name){ctx.fillStyle='#FFF';ctx.font='26px Arial';ctx.textAlign='center';ctx.fillText(inventory[i].icon,s.x+s.w/2,s.y+s.h/2-5);ctx.fillStyle='#FFF';ctx.font='bold 11px "Segoe UI",Arial,sans-serif';ctx.fillText(inventory[i].name,s.x+s.w/2,s.y+s.h+14);if(inventory[i].count>1){ctx.fillStyle='#FFD700';ctx.font='bold 13px Arial';ctx.fillText('x'+inventory[i].count,s.x+s.w-10,s.y+12);}}}let useBtn=uiButtons[5];ctx.fillStyle='#4CAF50';roundRect(ctx,useBtn.x,useBtn.y,useBtn.w,useBtn.h,14);ctx.fill();ctx.fillStyle='#FFF';ctx.font='bold 20px "Segoe UI",Arial,sans-serif';ctx.fillText(useBtn.text,useBtn.x+useBtn.w/2,useBtn.y+useBtn.h/2+7);let backBtn=uiButtons[6];ctx.fillStyle='#FFD700';roundRect(ctx,backBtn.x,backBtn.y,backBtn.w,backBtn.h,16);ctx.fill();ctx.fillStyle='#000';ctx.font='bold 20px "Segoe UI",Arial,sans-serif';ctx.fillText(backBtn.text,backBtn.x+backBtn.w/2,backBtn.y+backBtn.h/2+7);}
function drawButtons(){for(let btn of uiButtons){let bg=ctx.createLinearGradient(0,btn.y,0,btn.y+btn.h);bg.addColorStop(0,'#FFD700');bg.addColorStop(1,'#FF8C00');ctx.fillStyle=bg;roundRect(ctx,btn.x,btn.y,btn.w,btn.h,18);ctx.fill();ctx.fillStyle='#000';ctx.font='bold 22px "Segoe UI",Arial,sans-serif';ctx.fillText(btn.text,btn.x+btn.w/2,btn.y+btn.h/2+7);}}
function drawOverlay(){if(gameState==='gameover'){ctx.fillStyle='rgba(0,0,0,0.85)';ctx.fillRect(0,0,WORLD_W,WORLD_H);ctx.fillStyle='#FFF';ctx.font='bold 60px "Segoe UI",Arial,sans-serif';ctx.textAlign='center';ctx.fillText('GAME OVER',WORLD_W/2,WORLD_H/2-40);drawButtons();}else if(gameState==='victory'){ctx.fillStyle='rgba(255,215,0,0.9)';ctx.fillRect(0,0,WORLD_W,WORLD_H);ctx.fillStyle='#000';ctx.font='bold 60px "Segoe UI",Arial,sans-serif';ctx.textAlign='center';ctx.fillText('ПОБЕДА!',WORLD_W/2,WORLD_H/2-80);ctx.font='26px "Segoe UI",Arial,sans-serif';ctx.fillText('Карта '+currentMap+' пройдена!',WORLD_W/2,WORLD_H/2-35);drawButtons();}}
function resizeCanvas(){const w=gameWrapper.clientWidth,h=gameWrapper.clientHeight,s=Math.min(w/WORLD_W,h/WORLD_H),cw=WORLD_W*s,ch=WORLD_H*s;canvas.style.width=cw+'px';canvas.style.height=ch+'px';canvas.width=cw*devicePixelRatio;canvas.height=ch*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.scale(s,s);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';}
function gameLoop(){animationFrame++;resizeCanvas();if(gameState==='playing'){applyPhysics();updateCamera();updateEnemies();checkCollisions();collectItems();checkVictory();drawWorld();}else if(gameState==='main'||gameState==='maps'||gameState==='inventory'){drawUI();}else{drawWorld();drawOverlay();}requestAnimationFrame(gameLoop);}
const keys={left:false,right:false,jump:false};function doJump(){if(gameState==='playing'&&player.onGround){player.vy=player.jumpPower;player.onGround=false;}}
window.addEventListener('keydown',(e)=>{if(e.key==='Escape'){if(gameState==='maps'||gameState==='inventory')goToMain();else if(gameState==='playing'||gameState==='gameover'||gameState==='victory')goToMain();return;}if(gameState==='main'){if(e.key==='1'){gameState='maps';buildMapSelect();}if(e.key==='2'){gameState='inventory';buildInventory();}return;}if(gameState==='maps'){if(e.key>='1'&&e.key<='5')startMap(parseInt(e.key));return;}if(gameState==='inventory'){if(e.key>='1'&&e.key<='5'){activeSlot=parseInt(e.key)-1;}if(e.key==='e')useActiveItem();return;}if(gameState==='gameover'||gameState==='victory'){if(e.key==='r')fullReset();if(e.key==='Escape')goToMain();return;}if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key==='ArrowUp'||e.key==='w'||e.key===' '){keys.jump=true;doJump();}if(e.key==='e')useActiveItem();});
window.addEventListener('keyup',(e)=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')keys.jump=false;});
canvas.addEventListener('click',(e)=>{const rect=canvas.getBoundingClientRect(),sx=WORLD_W/rect.width,sy=WORLD_H/rect.height,mx=(e.clientX-rect.left)*sx,my=(e.clientY-rect.top)*sy;for(let btn of uiButtons){if(mx>=btn.x&&mx<=btn.x+btn.w&&my>=btn.y&&my<=btn.y+btn.h){if(btn.action==='maps'){gameState='maps';buildMapSelect();}else if(btn.action==='inventory'){gameState='inventory';buildInventory();}else if(btn.action==='startMap'&&!btn.locked){startMap(btn.mapNum);}else if(btn.action==='selectSlot'){activeSlot=btn.slot;}else if(btn.action==='useItem'){useActiveItem();}else if(btn.action==='main'){goToMain();}else if(btn.action==='restart'){fullReset();}else if(btn.action==='nextMap'){if(currentMap<5){currentMap++;startMap(currentMap);}}return;}}});
function setupBtn(id,action){const btn=document.getElementById(id);if(!btn)return;btn.addEventListener('pointerdown',(e)=>{e.preventDefault();e.stopPropagation();btn.classList.add('pressed');if(action==='menu')goToMain();else if(action==='restart'){if(gameState==='gameover'||gameState==='victory'||gameState==='playing')fullReset();}else if(action==='use')useActiveItem();else if(action==='left'&&gameState==='playing')keys.left=true;else if(action==='right'&&gameState==='playing')keys.right=true;else if((action==='up'||action==='jump')&&gameState==='playing'){keys.jump=true;doJump();}});btn.addEventListener('pointerup',(e)=>{e.preventDefault();e.stopPropagation();btn.classList.remove('pressed');if(action==='left')keys.left=false;if(action==='right')keys.right=false;if(action==='up'||action==='jump')keys.jump=false;});btn.addEventListener('pointerleave',()=>{btn.classList.remove('pressed');if(action==='left')keys.left=false;if(action==='right')keys.right=false;if(action==='up'||action==='jump')keys.jump=false;});}
setupBtn('btnLeft','left');setupBtn('btnRight','right');setupBtn('btnUp','up');setupBtn('btnJump','jump');setupBtn('btnRestart','restart');setupBtn('btnMenu','menu');setupBtn('btnUse','use');
document.addEventListener('touchmove',(e)=>{if(e.target.closest('.ctrl-btn'))e.preventDefault();},{passive:false});

// ИСПРАВЛЕННАЯ ПРОВЕРКА ОРИЕНТАЦИИ
function checkOrientation(){
  const isLandscape = window.innerWidth > window.innerHeight;
  if(isLandscape){
    rotateScreen.style.display = 'none';
    gameWrapper.style.display = 'flex';
    resizeCanvas();
  } else {
    rotateScreen.style.display = 'flex';
    gameWrapper.style.display = 'none';
  }
}
// Запускаем проверку сразу
checkOrientation();
// Слушаем изменение ориентации
window.addEventListener('orientationchange', function(){
  // Даём браузеру время обновить размеры
  setTimeout(checkOrientation, 100);
  setTimeout(checkOrientation, 300);
  setTimeout(checkOrientation, 500);
});
window.addEventListener('resize', checkOrientation);
// Дополнительно: проверяем через screen.orientation если доступно
if(window.screen && window.screen.orientation){
  window.screen.orientation.addEventListener('change', function(){
    setTimeout(checkOrientation, 100);
    setTimeout(checkOrientation, 300);
  });
}

buildMainMenu();updateUI();gameLoop();
})();
</script>
